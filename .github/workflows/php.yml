name: PHP Composer

on:
  push:
    branches: [ "deliverable" ]
  pull_request:
    branches: [ "deliverable" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.5']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.1.1

    - name: Setup PHP ${{ matrix.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, intl, curl, json, pdo, gd, exif
        tools: composer
        coverage: xdebug

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run PHPUnit tests with coverage
      run: vendor/bin/phpunit --coverage-text --coverage-html=coverage

    - name: Run PHPStan static analysis (Level 6)
      run: vendor/bin/phpstan analyse src --level 6

    - name: Check code style with PHP-CS-Fixer
      run: vendor/bin/php-cs-fixer fix src --dry-run --diff

    - name: Check code modernization with Rector
      id: rector
      continue-on-error: true
      run: vendor/bin/rector process src --dry-run

    - name: Report Rector changes needed
      if: steps.rector.outcome == 'failure'
      run: |
        echo "⚠️  Rector detected code modernization opportunities."
        echo "Run 'composer rector:fix' locally and commit the changes."
        exit 1

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report
        path: coverage/

